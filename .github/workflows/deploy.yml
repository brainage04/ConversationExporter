name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Merges made with the GITHUB_TOKEN (Dependabot's auto-merge) start no push run, so a daily build deploys them.
  schedule:
    - cron: '17 3 * * *'

jobs:
  test:
    uses: brainage04/AstroShell/.github/workflows/package-test.yml@545949e3f47f83acfe5d28f74921c427fd410eff # v0.7.0
    permissions:
      contents: read

  deploy:
    needs: test
    uses: brainage04/AstroShell/.github/workflows/site-deploy.yml@545949e3f47f83acfe5d28f74921c427fd410eff # v0.7.0
    with:
      path: site
    permissions:
      contents: read
      pages: write
      id-token: write
