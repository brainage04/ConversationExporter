version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /site
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      npm-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # A 0.x minor release of the shell can break the site, so the shell is bumped by hand.
      - dependency-name: '@brainage04/astro-shell'
        update-types:
          - version-update:semver-minor
      # TypeScript 7 has no JS compiler API yet, and both @astrojs/check and typescript-eslint need it, so npm ci fails.
      # Drop this once https://github.com/withastro/roadmap/discussions/1321 and
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 ship TypeScript 7 support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      github-actions-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # The shell's reusable workflows move with the shell package, by hand.
      - dependency-name: brainage04/AstroShell
        update-types:
          - version-update:semver-minor
