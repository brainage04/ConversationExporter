version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /site
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      npm-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # A 0.x minor release of the shell can break the site, so the shell is bumped by hand.
      - dependency-name: '@brainage04/astro-shell'
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      github-actions-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # The shell's reusable workflows move with the shell package, by hand.
      - dependency-name: brainage04/AstroShell
        update-types:
          - version-update:semver-minor
